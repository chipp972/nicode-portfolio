[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# Les redirections des anciennes URLs Gatsby (/terms, /credits) sont dans
# src/proxy.ts et non ici : sur Netlify, les edge functions s'exécutent avant
# les règles de redirection, donc le proxy next-intl les interceptait d'abord.

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 3000
