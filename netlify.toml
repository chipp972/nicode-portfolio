[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# Anciennes URLs du site Gatsby (monolingue, sans préfixe de locale).
[[redirects]]
  from = "/terms"
  to = "/fr/mentions-legales"
  status = 301
  force = true

[[redirects]]
  from = "/credits"
  to = "/fr/credits"
  status = 301
  force = true

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 3000
